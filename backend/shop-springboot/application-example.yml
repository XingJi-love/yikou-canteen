# ==================== 服务器配置 ====================
server:
  port: 8080

# ==================== Spring 框架核心配置 ====================
spring:
  datasource:
    # MySQL 数据库连接（Asia/Shanghai 时区，禁用 SSL）
    url: jdbc:mysql://127.0.0.1:3306/wxshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your_password            # ⚠️ 请替换为你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    # JSON 序列化时忽略 null 字段
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB   # 单文件最大 10MB
      max-request-size: 10MB # 单次请求最大 10MB

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线 → 驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 控制台输出

# ==================== 日志级别 ====================
logging:
  level:
    fun.xingji.wxshop.mapper: DEBUG  # Mapper SQL 日志

# ==================== PageHelper 分页插件 ====================
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# ==================== 应用自定义配置 ====================
app:
  table-prefix: wxshop_                    # 数据库表前缀
  static-upload-dir: d:/0-miniprogram/mp-weixin/backend/shop-springboot/uploads  # ⚠️ 上传文件存储路径，请根据实际环境修改
  wechat-appid: "your_appid"               # ⚠️ 请替换为你的微信小程序 AppID
  wechat-secret: "your_appsecret"          # ⚠️ 请替换为你的微信小程序 AppSecret
